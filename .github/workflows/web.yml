# Publica web/ en GitHub Pages en cada push a main que toque el sitio o las cifras.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Sitio web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "p01-edificios-overture/output/*.json"
      - "p02-concentracion/output/*.json"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Solo publica desde el repo de Kaimind; en los forks se salta
    if: github.repository == 'Kaimind-Technologies/venezuela-datos-abiertos'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Da la URL real del sitio: github.io/<repo> o el dominio propio si está configurado
      - id: pages
        uses: actions/configure-pages@v6
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
