# Publica web/ (con la API v0 en web/public/api/v0/) en GitHub Pages en cada push a main que toque
# el sitio, las cifras o las capas.
# Requiere: Settings → Pages → Source: "GitHub Actions".
name: Sitio web

on:
  push:
    branches: [main]
    paths:
      - "web/**"
      - "p01-edificios-overture/output/*.json"
      - "p02-concentracion/output/*.json"
      - "p03-crecimiento/output/*.json"
      - "p03-crecimiento/video/serie_anual.json"
      - "p0*/output/*.parquet"
      - "api/**"
      - ".github/workflows/web.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    # Solo publica desde el repo de Kaimind; en los forks se salta
    if: github.repository == 'Kaimind-Technologies/venezuela-datos-abiertos'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      # Da la URL real del sitio: github.io/<repo> o el dominio propio si está configurado
      - id: pages
        uses: actions/configure-pages@v6
      # La API v0 publicada tiene que coincidir con los resultados del repo: si alguien cambió
      # un output/*.json sin regenerarla (python -P api/build_api.py), no se publica nada.
      - name: Verificar la API v0
        working-directory: .
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install --quiet "duckdb>=1.5.0,<2"
          /tmp/venv/bin/python -P api/build_api.py --check
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}
          VITE_SITE_URL: ${{ steps.pages.outputs.base_url }}
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
